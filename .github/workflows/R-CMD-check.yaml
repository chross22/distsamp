name: R-CMD-check

# distsamp consumes the same reusable workflow it hosts, so the shared path is
# exercised here on every push rather than only when another repo calls it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    uses: ./.github/workflows/r-cmd-check-reusable.yaml
    with:
      # sf is only in Suggests, but the vignette and the spatial tests use it.
      apt-packages: 'libgdal-dev libgeos-dev libproj-dev libudunits2-dev'
