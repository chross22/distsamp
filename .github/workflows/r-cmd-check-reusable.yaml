name: R-CMD-check (reusable)

# A shared R CMD check, callable from any of the R package repositories.
#
# Add this to a consuming repo as .github/workflows/R-CMD-check.yaml:
#
#   name: R-CMD-check
#   on:
#     push:
#       branches: [main, master]
#     pull_request:
#     workflow_dispatch:
#   permissions: read-all
#   jobs:
#     check:
#       uses: chross22/distsamp/.github/workflows/r-cmd-check-reusable.yaml@main
#       with:
#         apt-packages: 'libgdal-dev libgeos-dev libproj-dev libudunits2-dev'
#
# The matrix is the one these repositories already converged on: Ubuntu at
# devel, release and oldrel-1, plus macOS and Windows at release. Overridable
# via the `matrix` input for a repo that needs something different.
#
# `apt-packages` exists because the packages genuinely differ: the spatial ones
# need GDAL/GEOS/PROJ/udunits, and msomgom suggests rjags, which will not
# install without the JAGS system library. r-lib/actions resolves most system
# dependencies on its own, but being explicit costs nothing and fails loudly
# rather than mysteriously.

on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON array of {os, r} objects. Defaults to the standard five.'
        type: string
        default: >-
          [{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},
           {"os":"ubuntu-latest","r":"release"},
           {"os":"ubuntu-latest","r":"oldrel-1"},
           {"os":"macos-latest","r":"release"},
           {"os":"windows-latest","r":"release"}]
      apt-packages:
        description: 'Extra Ubuntu system packages, space separated.'
        type: string
        default: ''
      extra-packages:
        description: >-
          Extra R packages for setup-r-dependencies. pak syntax, so a package
          that is not on CRAN goes here too, e.g.
          'any::rcmdcheck, github::BigelowLab/copernicus'.
        type: string
        default: 'any::rcmdcheck'
      extra-repositories:
        description: >-
          Additional repositories for setup-r, e.g.
          'https://ropensci.r-universe.dev' for rnaturalearthhires, which is not
          on CRAN.
        type: string
        default: ''
      build-args:
        description: 'Arguments passed to R CMD build.'
        type: string
        default: 'c("--no-manual")'
      check-args:
        description: 'Arguments passed to rcmdcheck.'
        type: string
        default: 'c("--no-manual", "--as-cran")'
      error-on:
        description: 'Severity that fails the build: "note", "warning", or "error".'
        type: string
        default: '"warning"'
      upload-snapshots:
        description: 'Upload testthat snapshots on failure.'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: ${{ inputs.extra-repositories }}

      - name: Install system dependencies
        if: runner.os == 'Linux' && inputs.apt-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt-packages }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ inputs.extra-packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: ${{ inputs.upload-snapshots }}
          build_args: ${{ inputs.build-args }}
          args: ${{ inputs.check-args }}
          error-on: ${{ inputs.error-on }}
