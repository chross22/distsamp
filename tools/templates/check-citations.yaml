# Drop this in as .github/workflows/check-citations.yaml in any repo that has a
# tools/citations.csv. Nothing else is required: the checking engine is fetched
# from chross22/distsamp at run time, so fixes land everywhere at once.
#
# Optional: add tools/citation-hooks.R with a citation_hooks() function to run
# project-specific checks alongside the four generic ones.

name: check-citations

on:
  schedule:
    - cron: '0 7 1 * *'      # 07:00 UTC, 1st of the month
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - 'R/**'
      - 'docs/**'
      - 'README.md'
      - 'DESCRIPTION'
      - 'inst/CITATION'

permissions:
  contents: read
  issues: write

jobs:
  citations:
    uses: chross22/distsamp/.github/workflows/citation-check-reusable.yaml@main
