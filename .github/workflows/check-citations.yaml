name: check-citations

# distsamp consumes the same reusable workflow it hosts, so the shared engine is
# exercised on every run rather than only when another repo calls it.

on:
  schedule:
    # 07:00 UTC on the 1st of each month
    - cron: '0 7 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/**'
      - 'R/**'
      - 'docs/**'
      - 'README.md'
      - 'DESCRIPTION'
      - 'inst/CITATION'

permissions:
  contents: read
  issues: write

jobs:
  citations:
    uses: ./.github/workflows/citation-check-reusable.yaml
